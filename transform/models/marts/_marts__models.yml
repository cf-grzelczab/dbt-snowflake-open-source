version: 2

models:
  - name: fct_trips
    description: >
      One row per valid yellow taxi trip. Incremental: each run only merges trips
      from files loaded after the latest loaded_at already in the table.
    columns:
      - name: trip_id
        data_tests:
          - unique
          - not_null
      - name: pickup_location_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_zones')
                field: location_id
      - name: trip_duration_minutes
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1440
                inclusive: false
      - name: surcharges_amount
        description: >
          Sum of extra, MTA tax, improvement and congestion surcharges, airport fee
          and CBD congestion fee (missing components count as 0).
      - name: trip_distance_miles
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 500
                inclusive: false

  - name: dim_zones
    description: TLC taxi zones with borough and an airport flag.
    columns:
      - name: location_id
        data_tests:
          - unique
          - not_null

  - name: agg_daily_trips
    description: Daily trip counts and revenue per pickup borough.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [pickup_date, pickup_borough]

  - name: agg_hourly_trips
    description: Average demand per weekday and hour of day, for spotting rush hours.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [pickup_day_of_week, pickup_hour]
    columns:
      - name: avg_trips_per_day
        description: Trips in this weekday/hour slot divided by the number of such days in the data.
