version: 2

models:
  - name: stg_tlc__yellow_trips
    description: Yellow taxi trips with readable column names and exact duplicates removed.
    columns:
      - name: trip_id
        description: Surrogate key built from the trip attributes (the TLC data has no natural key).
        data_tests:
          - unique
          - not_null
      - name: pickup_at
        data_tests:
          - not_null
      - name: pickup_location_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_tlc__taxi_zones')
                field: location_id
      - name: dropoff_location_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_tlc__taxi_zones')
                field: location_id
      - name: payment_type_id
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3, 4, 5, 6]
                quote: false
              config:
                where: "payment_type_id is not null"

  - name: stg_tlc__taxi_zones
    description: TLC taxi zones (from the taxi_zone_lookup seed).
    columns:
      - name: location_id
        data_tests:
          - unique
          - not_null
      - name: borough
        data_tests:
          - accepted_values:
              arguments:
                values: [Bronx, Brooklyn, EWR, Manhattan, Queens, Staten Island, Unknown]
