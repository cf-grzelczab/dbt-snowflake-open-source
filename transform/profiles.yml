# No secrets in here: every value is read from the git-ignored .env file.
# dbt picks this file up because it sits in the directory you run dbt from.
course_project:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      # SNOWFLAKE_PAT wins when set; otherwise SNOWFLAKE_AUTHENTICATOR (default SSO) with optional password
      authenticator: "{{ 'programmatic_access_token' if env_var('SNOWFLAKE_PAT', '') else (env_var('SNOWFLAKE_AUTHENTICATOR', '') or 'externalbrowser') }}"
      token: "{{ env_var('SNOWFLAKE_PAT', '') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD', '') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE') }}"
      schema: "{{ env_var('SNOWFLAKE_SCHEMA') }}"
      threads: 4
      client_session_keep_alive: false
